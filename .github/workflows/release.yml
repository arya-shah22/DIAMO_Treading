name: Build & Release DIAMO_TREADING

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Check version & existing release tag
        id: meta
        run: |
          VERSION=$(node -p "require('./application/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; skipping release build."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.meta.outputs.should_release == 'true'
        working-directory: application
        run: npm ci

      - name: Install Linux runtime libs for Electron test runner
        if: steps.meta.outputs.should_release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libgtk-3-0 libasound2t64 || sudo apt-get install -y libnss3 libnspr4 libgtk-3-0 libasound2

      - name: Typecheck, build, and run unit tests
        if: steps.meta.outputs.should_release == 'true'
        working-directory: application
        run: |
          npm run typecheck
          npm run build
          npm test

  package:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            script: package:mac
          - os: windows-2022
            script: package:win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Install dependencies
        working-directory: application
        run: npm ci

      - name: Package installer
        working-directory: application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            application/dist/*.dmg
            application/dist/*.exe
          if-no-files-found: error

  publish:
    needs: [check, package]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: DIAMO_TREADING v${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
